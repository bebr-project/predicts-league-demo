<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101513">
  <meta name="description" content="Автономная демонстрация футбольной лиги прогнозов: матчи, ставки, рейтинг и чат.">
  <title>Лига прогнозов — автономное демо</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./demo.js"></script>
</head>
<body>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m9 8 3-2 3 2-1 4-4 1-2-3zM5 9l3 1m7-2 4-1m-9 6-1 5m5-6 2 5M5 16l4 2m7-1 3-2"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9H3zM9 20v-7h6v7"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V4m0 16h16M8 16v-4m4 4V8m4 8V6m4 10v-5"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3-7 8-7s8 3 8 7"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4m8-4v4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 2 6M4 5v6h6"/></symbol>
  </svg>

  <a class="skip-link" href="#screen">К основному содержимому</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Навигация">
      <div class="brand"><span class="brand-mark"><svg><use href="#i-ball"/></svg></span><span><small>ЛИЧНАЯ ЛИГА</small><strong>Лига прогнозов</strong></span></div>
      <nav class="nav-list" aria-label="Разделы приложения">
        <button type="button" class="nav-button" data-view="feed"><svg><use href="#i-home"/></svg><span>Лента</span></button>
        <button type="button" class="nav-button" data-view="matches"><svg><use href="#i-calendar"/></svg><span>Матчи</span></button>
        <button type="button" class="nav-button" data-view="chat"><svg><use href="#i-chat"/></svg><span>Чат</span></button>
        <button type="button" class="nav-button" data-view="ranking"><svg><use href="#i-chart"/></svg><span>Рейтинг</span></button>
        <button type="button" class="nav-button" data-view="profile"><svg><use href="#i-user"/></svg><span>Профиль</span></button>
      </nav>
      <div class="sidebar-foot">Портфолио-версия · без внешних API</div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-title"><span class="eyebrow">PREDICTS · ДЕМО</span><h1>Лига прогнозов</h1></div>
        <div class="topbar-metrics"><div class="metric"><span>ВАШ БАЛАНС</span><strong id="balanceText">—</strong></div><div class="metric"><span>ЛИДЕР ТУРА</span><strong id="leaderText">—</strong></div></div>
      </header>
      <main id="screen" tabindex="-1"></main>
    </div>

    <nav class="bottom-nav" aria-label="Разделы приложения">
      <button type="button" class="nav-button" data-view="feed"><svg><use href="#i-home"/></svg><span>Лента</span></button>
      <button type="button" class="nav-button" data-view="matches"><svg><use href="#i-calendar"/></svg><span>Матчи</span></button>
      <button type="button" class="nav-button" data-view="chat"><svg><use href="#i-chat"/></svg><span>Чат</span></button>
      <button type="button" class="nav-button" data-view="ranking"><svg><use href="#i-chart"/></svg><span>Рейтинг</span></button>
      <button type="button" class="nav-button" data-view="profile"><svg><use href="#i-user"/></svg><span>Профиль</span></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
